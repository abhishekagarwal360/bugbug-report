name: BugBug sheet daily
on:
  schedule:
    - cron: '30 5 * * *'    # 11:00 AM IST
  workflow_dispatch:
permissions:
  contents: write           # only for the keepalive commit below
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Update the Google Sheet
        env:
          PYTHONIOENCODING: utf-8
          BUGBUG_TOKENS: ${{ secrets.BUGBUG_TOKENS }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          set -o pipefail
          python3 bugbug_report.py auto 2>&1 | grep -v "projectId="
      # GitHub switches off scheduled jobs in a repo with no commits for 60 days
      - name: Keepalive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            git config user.name "bugbug-bot" && git config user.email "bugbug-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push
          fi
